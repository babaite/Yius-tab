<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yiu‘s tab</title><link rel="icon" href="../icon/icon32.png"><link rel="stylesheet" href="../newtab/surfaces.css"><link rel="stylesheet" href="index.css"><link rel="stylesheet" href="../newtab/notifications.css"><script type="module" src="index.js"></script><link rel="stylesheet" href="../newtab/scrollbars.css"></head><body><main>
<header><img src="../icon/icon128.png" alt="" width="64" height="64"><div><p>Yiu‘s tab</p><h1 data-i18n="extensionSettings"></h1></div></header>
<section id="backup-card"><h2 data-i18n="configuration"></h2><p data-i18n="backupHint"></p><div class="actions"><button id="export" data-action class="primary" data-i18n="exportConfig"></button><button id="import" data-action data-i18n="importConfig"></button><input id="backup-file" type="file" accept=".json,application/json" hidden></div><p class="subtle" data-i18n="backupPrivacy"></p>
<div id="import-review" hidden><p id="import-summary"></p><p data-i18n="importHint"></p><div class="actions"><button id="apply-import" data-action class="primary" data-i18n="applyImport"></button><button id="cancel-import" data-i18n="cancelImport"></button></div></div></section>
<section id="icon-source-card"><h2 data-i18n="thirdPartySettings"></h2><p data-i18n="thirdPartyHint"></p><label for="icon-template" data-i18n="interfaceURL"></label><input id="icon-template" type="url" spellcheck="false" dir="ltr" aria-describedby="icon-template-error"><p id="icon-template-error" class="field-error" role="status"></p><p class="subtle" data-i18n="templateHint"></p><div class="actions presets"><button type="button" data-action data-preset="favicon">Favicon.im</button><button type="button" data-action data-preset="google">Google</button></div></section>
<section id="cloud-connection-card"><h2 data-i18n="cloudSettings"></h2><p data-i18n="cloudHint"></p><label for="cloud-url" data-i18n="cloudURL"></label><input id="cloud-url" autocomplete="off" type="url" dir="ltr" spellcheck="false" aria-describedby="cloud-url-error"><p id="cloud-url-error" class="field-error" role="status"></p><div class="columns"><div><label for="cloud-user" data-i18n="cloudUser"></label><input id="cloud-user" autocomplete="off"></div><div><label for="cloud-password" data-i18n="cloudPassword"></label><input id="cloud-password" type="password" autocomplete="off"></div></div><label class="check"><input id="remember-secret" type="checkbox"><span data-i18n="rememberSecret"></span></label><p class="subtle" data-i18n="cloudPrivacy"></p><label class="check"><input id="sync-enabled" type="checkbox"><span data-i18n="syncEnable"></span></label></section>
<section id="cloud-status-card"><h2 data-i18n="syncActivity"></h2><div class="sync-activity-row"><div class="actions"><button id="sync-recover" data-action type="button" data-i18n="syncRecover"></button></div><div class="sync-status-region"><div id="sync-feedback"><p id="sync-status" role="status" aria-live="polite"></p><p id="sync-time" class="subtle"></p></div><div id="sync-conflicts"><p class="sr-only" data-i18n="syncConflictHint"></p><div class="actions"><button id="sync-local" data-action data-i18n="syncKeepLocal"></button><button id="sync-remote" data-action data-i18n="syncKeepRemote"></button></div></div></div></div></section>
<section id="diagnostics-card"><h2 data-i18n="diagnosticsTitle"></h2><div class="actions"><button id="sync-diagnostics" type="button" data-action data-i18n="syncDiagnostics"></button></div></section>
<footer><p id="status" role="status" aria-live="polite"></p></footer>
</main></body></html>
